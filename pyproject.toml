[project]
name = "transcriber"
version = "0.1.0"
description = "Transcrição local de vídeos usando faster-whisper com suporte a GPU"
requires-python = ">= 3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "ffmpeg-python>=0.2.0",
    "rich>=13.0.0",
    "nvidia-cublas-cu12>=12.4.0",
    "nvidia-cudnn-cu12>=9.1.0",
]

[project.scripts]
transcriber = "transcriber.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
